services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: ["node", "dist/worker.js"]
    environment:
      REDIS_HOST: redis
    depends_on: [redis]

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8080
    ports: ["3000:8080"]
    depends_on: [api]

volumes:
  db-data:
