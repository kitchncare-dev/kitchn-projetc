
name: ci

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # API PYTHON
  # ==========================================

  api:
    name: ci-api
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tester l'API
        run: pytest -v


  # ==========================================
  # FRONTEND
  # ==========================================

  web:
    name: ci-web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build


  # ==========================================
  # DOCKER BUILD & TEST
  # ==========================================

  docker:
    name: ci-docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image API
        run: |
          docker build -t api-demo apps/api

      - name: Tester le conteneur API
        run: |
          docker run -d \
            --name api \
            -p 8080:8080 \
            api-demo

          curl -fsS --retry 20 --retry-delay 2 \
            --retry-all-errors \
            http://localhost:8080/health

          curl -fsS http://localhost:8080/ | grep -q '"status":"OK"'

      - name: Construire l'image Frontend
        run: |
          docker build -t web-demo apps/web

      - name: Nettoyage des conteneurs
        if: always()
        run: |
          docker rm -f api web 2>/dev/null || true


  # ==========================================
  # SECURITY
  # ==========================================

  security:
    name: ci-security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Recherche de secrets (Gitleaks)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir --redact --verbose --no-banner /repo
          echo "API URL: $URL"

          curl -fsS --retry 10 --retry-delay 3 \
            --retry-all-errors "$URL/health"
