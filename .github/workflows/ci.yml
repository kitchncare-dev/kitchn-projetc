
name: ci

on:
  pull_request:
    branches: [dev, main]

  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # API PYTHON
  # ==========================================

  api:
    name: ci-api
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tester l'API
        run: pytest -v


  # ==========================================
  # FRONTEND
  # ==========================================

  web:
    name: ci-web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build


  # ==========================================
  # DOCKER BUILD & TEST
  # ==========================================

  docker:
    name: ci-docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image API
        run: |
          docker build -t api-demo apps/api

      - name: Tester le conteneur API
        run: |
          docker run -d \
            --name api \
            -p 8080:8080 \
            api-demo

          curl -fsS --retry 20 --retry-delay 2 \
            --retry-all-errors \
            http://localhost:8080/health

          curl -fsS http://localhost:8080/ | grep -q '"status":"OK"'

      - name: Construire l'image Frontend
        run: |
          docker build -t web-demo apps/web

      - name: Tester le conteneur Frontend
        run: |
          docker run -d \
            --name web \
            -p 3000:8080 \
            web-demo

          curl -fsS --retry 20 --retry-delay 2 \
            --retry-all-errors \
            http://localhost:3000/api/health

      - name: Nettoyage des conteneurs
        if: always()
        run: |
          docker rm -f api web 2>/dev/null || true


  # ==========================================
  # SECURITY
  # ==========================================

  security:
    name: ci-security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Recherche de secrets (Gitleaks)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir --redact --verbose --no-banner /repo


  # ==========================================
  # DEPLOY GOOGLE CLOUD RUN
  # ==========================================

  deploy:
    name: deploy-cloud-run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: [api, docker, security]

    # Déploiement uniquement après un push sur main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

    steps:
      - uses: actions/checkout@v4

      # Authentification Google Cloud sans clé JSON
      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Installer Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Configuration Docker avec Artifact Registry
      - name: Configurer Docker
        run: |
          gcloud auth configure-docker \
            $REGION-docker.pkg.dev --quiet

      # Construction et publication de l'image
      - name: Build et Push API
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/api:${GITHUB_SHA}"

          docker build \
            -t "$IMAGE" \
            apps/api

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Déploiement Cloud Run
      - name: Déployer sur Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated

      # Vérification après déploiement
      - name: Vérifier le déploiement
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')

          echo "API URL: $URL"

          curl -fsS --retry 10 --retry-delay 3 \
            --retry-all-errors "$URL/health"

