

name: ci

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: ci-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  web:
    name: ci-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: ci-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire et démarrer l'image API
        run: |
          docker build -t api-demo apps/api
          docker run -d --name api -p 8080:8080 api-demo
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors http://localhost:8080/health
          docker rm -f api
      - name: Construire et démarrer l'image front
        run: |
          docker build -t web-demo apps/web
          docker run -d --name web -p 3000:8080 web-demo
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors http://localhost:3000/api/health
          docker rm -f web

  security:
    name: ci-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recherche de secrets dans le code (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest dir --redact --no-banner /repo
