name: deploy

on:
  push:
    branches: [dev, main]

  # Lancement manuel (onglet Actions > deploy > Run workflow), par exemple pour
  # redéployer un service après un échec. Choisis la branche dev ou main.
  workflow_dispatch:
    inputs:
      api:
        description: "Déployer l'API (my-api)"
        type: boolean
        default: true
      web:
        description: "Déployer le front (my-web-app)"
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false   # on ne coupe jamais un déploiement en cours

permissions:
  contents: read

jobs:

  # ------------------------------------------------------------------
  # Quelles parties ont changé depuis le dernier push sur cette branche ?
  # Ce job n'a aucun accès à Google Cloud.
  # ------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détecter les parties modifiées
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_API: ${{ inputs.api }}
          INPUT_WEB: ${{ inputs.web }}
        run: |
          api=false
          web=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Lancement manuel : on suit les cases cochées."
            api="$INPUT_API"
            web="$INPUT_WEB"
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Premier push de la branche, ou historique réécrit : on ne sait pas comparer
            echo "Commit précédent introuvable : on déploie tout par sécurité."
            api=true
            web=true
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "Fichiers modifiés :"
            echo "$CHANGED"
            if echo "$CHANGED" | grep -q '^apps/api/'; then api=true; fi
            if echo "$CHANGED" | grep -q '^apps/web/'; then web=true; fi
            # Une modification de ce workflow redéploie tout, pour le tester en entier
            if echo "$CHANGED" | grep -q '^\.github/workflows/deploy\.yml$'; then api=true; web=true; fi
          fi

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "### À déployer : API = $api, Web = $web" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Déploiement : sauté si rien à déployer (pas de demande d'approbation en prod)
  # ------------------------------------------------------------------
  deploy:
    name: deploy
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # dev -> environnement GitHub "dev" ; main -> environnement "prod" (avec ton approbation)
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: app             # dépôt Artifact Registry créé par Terraform
      API_SERVICE: my-api         # services Cloud Run créés par Terraform
      WEB_SERVICE: my-web-app
      DEPLOY_API: ${{ needs.changes.outputs.api }}
      DEPLOY_WEB: ${{ needs.changes.outputs.web }}

    steps:
      - uses: actions/checkout@v4

      - name: Authentification Google Cloud (sans clé)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurer Docker pour Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      # ---------------- Images ----------------

      - name: Construire et publier l'image API
        if: env.DEPLOY_API == 'true'
        run: |
          API_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/api:$GITHUB_SHA"
          docker build -t "$API_IMAGE" apps/api
          docker push "$API_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"

      - name: Construire et publier l'image web
        if: env.DEPLOY_WEB == 'true'
        run: |
          WEB_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/web:$GITHUB_SHA"
          docker build -t "$WEB_IMAGE" apps/web
          docker push "$WEB_IMAGE"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"

      # ------- Révisions actuelles (pour un retour arrière) -------

      - name: Noter la révision actuelle de l'API
        if: env.DEPLOY_API == 'true'
        run: |
          API_PREVIOUS=$(gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')
          echo "API_PREVIOUS=$API_PREVIOUS" >> "$GITHUB_ENV"

      - name: Noter la révision actuelle du front
        if: env.DEPLOY_WEB == 'true'
        run: |
          WEB_PREVIOUS=$(gcloud run services describe "$WEB_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')
          echo "WEB_PREVIOUS=$WEB_PREVIOUS" >> "$GITHUB_ENV"

      # ---------------- API d'abord ----------------

      - name: Déployer l'API
        if: env.DEPLOY_API == 'true'
        run: |
          gcloud run services update "$API_SERVICE" \
            --image "$API_IMAGE" \
            --project "$PROJECT_ID" --region "$REGION"
          gcloud run services update-traffic "$API_SERVICE" --to-latest \
            --project "$PROJECT_ID" --region "$REGION"

      - name: Vérifier l'API
        if: env.DEPLOY_API == 'true'
        run: |
          URL=$(gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          echo "API : $URL"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$URL/health"

      # ---------------- Puis le front ----------------

      - name: Déployer le front web
        if: env.DEPLOY_WEB == 'true'
        run: |
          gcloud run services update "$WEB_SERVICE" \
            --image "$WEB_IMAGE" \
            --project "$PROJECT_ID" --region "$REGION"
          gcloud run services update-traffic "$WEB_SERVICE" --to-latest \
            --project "$PROJECT_ID" --region "$REGION"

      - name: Vérifier le front web
        if: env.DEPLOY_WEB == 'true'
        run: |
          URL=$(gcloud run services describe "$WEB_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          echo "Web : $URL"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$URL/api/health"

      - name: Résumé du déploiement
        run: |
          api_status="non modifiée, pas redéployée"
          web_status="non modifié, pas redéployé"
          [ "$DEPLOY_API" = "true" ] && api_status="déployée : $API_IMAGE"
          [ "$DEPLOY_WEB" = "true" ] && web_status="déployé : $WEB_IMAGE"
          {
            echo "### Déploiement ${{ github.ref_name }} réussi"
            echo ""
            echo "- API : $api_status"
            echo "- Web : $web_status"
          } >> "$GITHUB_STEP_SUMMARY"

      # Si une étape échoue, on remet sur leur révision précédente les services
      # touchés par ce déploiement (et seulement eux).
      - name: Retour arrière automatique si échec
        if: failure()
        run: |
          for pair in "$API_SERVICE:${API_PREVIOUS:-}" "$WEB_SERVICE:${WEB_PREVIOUS:-}"; do
            service="${pair%%:*}"
            previous="${pair#*:}"
            if [ -n "$previous" ]; then
              echo "Retour de $service à la révision $previous"
              gcloud run services update-traffic "$service" \
                --to-revisions "$previous=100" \
                --project "$PROJECT_ID" --region "$REGION" \
                || echo "::error::Retour arrière impossible pour $service"
            fi
          done

      # Notification Telegram du résultat (dev uniquement). Rien n'est envoyé si les secrets
      # TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID n'existent pas.
      - name: Notification Telegram
        if: always() && github.ref_name == 'dev'
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "${{ job.status == 'success' && '🚀 Déploiement dev réussi' || '❌ Déploiement dev échoué (retour arrière automatique)' }} — API : ${{ env.DEPLOY_API == 'true' && 'déployée' || 'inchangée' }}, web : ${{ env.DEPLOY_WEB == 'true' && 'déployé' || 'inchangé' }}\n${{ github.event.head_commit.message || 'lancement manuel' }}"
          buttons: '[[{"text":"Voir l’exécution","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}]]'
