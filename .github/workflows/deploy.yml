name: deploy

on:
  push:
    branches: [dev, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false   # on ne coupe jamais un déploiement en cours

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # dev -> environnement GitHub "dev" ; main -> environnement "prod" (avec ton approbation)
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: app      # dépôt Artifact Registry créé par Terraform
      SERVICE: monapp      # service Cloud Run créé par Terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authentification Google Cloud (sans clé)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurer Docker pour Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Construire et publier l'image API
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/api:$GITHUB_SHA"
          docker build -t "$IMAGE" apps/api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Noter la révision actuelle (pour un retour arrière)
        run: |
          PREVIOUS=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"

      - name: Déployer la nouvelle révision
        run: |
          gcloud run services update "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" --region "$REGION"
          gcloud run services update-traffic "$SERVICE" --to-latest \
            --project "$PROJECT_ID" --region "$REGION"

      - name: Vérifier le déploiement
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          echo "URL : $URL"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$URL/health"

      - name: Retour arrière automatique si échec
        if: failure()
        run: |
          if [ -n "$PREVIOUS" ]; then
            echo "Retour à la révision $PREVIOUS"
            gcloud run services update-traffic "$SERVICE" \
              --to-revisions "$PREVIOUS=100" \
              --project "$PROJECT_ID" --region "$REGION"
          fi
