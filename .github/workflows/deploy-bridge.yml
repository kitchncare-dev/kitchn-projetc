name: deploy-bridge

# Teste puis déploie le pont Telegram (ops/telegram-bridge) sur Cloud Run, projet dev uniquement.
# Déclenché par un push sur dev qui touche le bridge, ou à la main
# (Actions → deploy-bridge → Run workflow), par exemple après avoir changé un secret.

on:
  push:
    branches: [dev]
    paths:
      - "ops/telegram-bridge/**"
      - ".github/workflows/deploy-bridge.yml"
  workflow_dispatch:

concurrency:
  group: deploy-bridge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: bridge-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/telegram-bridge/requirements.txt

      - name: Tests du bridge
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pip install -r ops/telegram-bridge/requirements.txt
          python -m pytest ops/telegram-bridge -q

  deploy:
    name: bridge-deploy
    needs: test
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: app
      SERVICE: telegram-bridge

    steps:
      - uses: actions/checkout@v4

      - name: Authentification Google Cloud (sans clé)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurer Docker pour Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Construire et publier l'image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/telegram-bridge:$GITHUB_SHA"
          docker build -t "$IMAGE" ops/telegram-bridge
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Noter la révision actuelle
        run: |
          PREVIOUS=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"

      # Une nouvelle révision relit aussi la dernière version de chaque secret
      - name: Déployer
        run: |
          gcloud run services update "$SERVICE" --image "$IMAGE" \
            --project "$PROJECT_ID" --region "$REGION"
          gcloud run services update-traffic "$SERVICE" --to-latest \
            --project "$PROJECT_ID" --region "$REGION"

      - name: Vérifier
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "Bridge : $URL"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$URL/health"
          # Sans le jeton secret, le webhook doit refuser (403)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/webhook" -H 'Content-Type: application/json' -d '{}')
          [ "$CODE" = "403" ] || { echo "::error::Le webhook répond $CODE sans jeton secret (403 attendu)."; exit 1; }
          echo "### Bridge déployé : $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Retour arrière si échec
        if: failure() && env.PREVIOUS != ''
        run: |
          gcloud run services update-traffic "$SERVICE" --to-revisions "$PREVIOUS=100" \
            --project "$PROJECT_ID" --region "$REGION" \
            || echo "::error::Retour arrière impossible"

      - name: Notification Telegram
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "${{ job.status == 'success' && '🌉 Bridge Telegram déployé' || '❌ Déploiement du bridge Telegram échoué' }}"
